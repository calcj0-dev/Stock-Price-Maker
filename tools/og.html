<!doctype html>
<!-- URL を貼ったときのカード画像（public/og-default.png、1200×630）の元。設計書 6章：決まった画像1枚。画像生成は使わない
     作り直すとき：node tools/og.mjs（Chrome と playwright-core が要る） -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --buy: #1e9e6a;
        --sell: #e8822a;
        --text: #1f1d1a;
        --sub: #6b665d;
        --surface: #f4f1ea;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #fff;
        font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: var(--text);
        display: grid;
        grid-template-columns: 520px 1fr;
        align-items: center;
        padding: 0 64px;
        gap: 48px;
      }
      .board {
        position: relative;
        height: 500px;
        border-radius: 28px;
        background: var(--surface);
        overflow: hidden;
      }
      .zone-buy { position: absolute; left: 0; top: 0; width: 46%; height: 52%; background: #e3f5ec; }
      .zone-sell { position: absolute; right: 0; bottom: 0; width: 46%; height: 48%; background: #fdeedf; }
      .line { position: absolute; left: 0; right: 0; top: 52%; border-top: 6px solid var(--text); }
      .pill {
        position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
        background: var(--text); color: #fff; font-weight: 800; font-size: 34px;
        padding: 6px 22px; border-radius: 999px;
      }
      .face {
        position: absolute; width: 44px; height: 44px; border-radius: 50%; transform: translate(-50%, -50%);
      }
      .face::before {
        content: ""; position: absolute; left: 11px; top: 14px; width: 6px; height: 6px; border-radius: 50%;
        background: #fff; box-shadow: 16px 0 0 #fff;
      }
      .face::after {
        content: ""; position: absolute; left: 13px; top: 22px; width: 18px; height: 9px;
        border-bottom: 3px solid #fff; border-radius: 0 0 18px 18px;
      }
      .b { background: var(--buy); left: 25%; }
      .s { background: var(--sell); left: 75%; }
      .off { background: #d4d0c8; }
      .off::after { top: 26px; border-bottom: none; border-top: 3px solid #fff; border-radius: 18px 18px 0 0; }
      h1 { font-size: 76px; line-height: 1.2; font-weight: 800; letter-spacing: 0.01em; }
      .tag { margin-top: 28px; font-size: 30px; line-height: 1.6; color: var(--sub); font-weight: 600; }
      .foot { margin-top: 36px; font-size: 22px; color: var(--sub); }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="zone-buy"></div>
      <div class="zone-sell"></div>
      <span class="face b" style="top: 12%"></span>
      <span class="face b" style="top: 24%"></span>
      <span class="face b" style="top: 36%"></span>
      <span class="face b" style="top: 46%"></span>
      <span class="face b off" style="top: 64%"></span>
      <span class="face b off" style="top: 76%"></span>
      <span class="face s off" style="top: 22%"></span>
      <span class="face s off" style="top: 36%"></span>
      <span class="face s" style="top: 60%"></span>
      <span class="face s" style="top: 70%"></span>
      <span class="face s" style="top: 80%"></span>
      <span class="face s" style="top: 90%"></span>
      <div class="line"></div>
      <div class="pill">1,000円</div>
    </div>
    <div>
      <h1>株価を<br />決めるのは誰？</h1>
      <p class="tag">あなたは株の値付け師。<br />買いたい人と売りたい人が<br />一番たくさん取引できる値段を決めよう。</p>
      <p class="foot">無料のブラウザゲーム ・ 会社とニュースは架空です</p>
    </div>
  </body>
</html>
